<title>26AW Key Agenda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');

    --text:#1E1D1A; --text-2:#5F5A4C; --text-3:#96907E;

    --grey-series:#A29B89; --grey-series-tint:#EDEAE2;
    --good:#2E7D5C; --good-bg:#E1EFE8; --good-line:#B9D8C7;
    --warn:#B3701A; --warn-bg:#F4E7D2; --warn-line:#E4C793;
    --crit:#AC3B3B; --crit-bg:#F3E1DF; --crit-line:#E0B5B1;
    --shadow: 0 1px 2px rgba(32,31,27,.04), 0 6px 16px -8px rgba(32,31,27,.12);
    --masthead-1:#16283F; --masthead-2:#1F3A5C;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17181A; --surface:#1E2022; --surface-2:#242628; --border:#36383A; --border-soft:#2C2E30;
      --text:#F1EFEA; --text-2:#B7B2A4; --text-3:#847E6E;
      --navy:#7FA3D1; --navy-dark:#A9C4E6; --navy-tint:#20303F;
      --brass:#D3AC55; --brass-tint:#332A17;
      --grey-series:#938D7C; --grey-series-tint:#2A2925;
      --good:#5CB78C; --good-bg:#1E3129; --good-line:#31513F;
      --warn:#E0954D; --warn-bg:#332818; --warn-line:#523F22;
      --crit:#E07B7B; --crit-bg:#332020; --crit-line:#54302F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181A; --surface:#1E2022; --surface-2:#242628; --border:#36383A; --border-soft:#2C2E30;
    --text:#F1EFEA; --text-2:#B7B2A4; --text-3:#847E6E;
    --navy:#7FA3D1; --navy-dark:#A9C4E6; --navy-tint:#20303F;
    --brass:#D3AC55; --brass-tint:#332A17;
    --grey-series:#938D7C; --grey-series-tint:#2A2925;
    --good:#5CB78C; --good-bg:#1E3129; --good-line:#31513F;
    --warn:#E0954D; --warn-bg:#332818; --warn-line:#523F22;
    --crit:#E07B7B; --crit-bg:#332020; --crit-line:#54302F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }
  h1,h2,h3{ font-family:'Noto Sans KR', sans-serif; font-weight:700; text-wrap:balance; margin:0; }
  a{ color:inherit; }

  .wrap{ max-width:1320px; margin:0 auto; padding:0 28px; }

  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(180deg, var(--masthead-1), var(--masthead-2));
    color:#F3F1E9;
    padding:26px 0 20px;
    border-bottom:4px solid var(--brass);
  }
  header.top .wrap{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#D9C68C; opacity:.95;
  }
  header.top h1{ font-size:24px; color:#FBF8EF; line-height:1.2; margin-top:4px; }
  .toplink{
    display:inline-flex; align-items:center; gap:4px; margin-top:8px;
    font-size:11.5px; font-weight:600; color:#D9C68C; text-decoration:none;
    border-bottom:1px solid rgba(217,198,140,.5);
  }
  .toplink:hover{ color:#FBF8EF; border-bottom-color:#FBF8EF; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 11px; border-radius:99px; font-size:11.5px; font-weight:500;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#EDE9DC;
  }
  .pill b{ font-weight:700; }
  .pill.warn{ background:rgba(224,149,77,.22); border:1px solid rgba(224,149,77,.55); color:#FBE3C4; }

  /* ---------- tab nav ---------- */
  nav.tabbar{
    position:sticky; top:0; z-index:30;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  nav.tabbar .wrap{ display:flex; gap:2px; overflow-x:auto; }
  nav.tabbar button{
    flex:0 0 auto; padding:14px 16px; font-size:13.5px; font-weight:600; color:var(--text-2);
    background:none; border:none; border-bottom:3px solid transparent; white-space:nowrap;
    font-family:inherit; cursor:pointer;
  }
  nav.tabbar button .n{
    display:inline-block; width:17px; height:17px; border-radius:5px; background:var(--grey-series-tint);
    color:var(--text-3); font-size:10px; font-weight:700; line-height:17px; text-align:center; margin-right:6px;
  }
  nav.tabbar button:hover{ color:var(--navy); }
  nav.tabbar button.active{ color:var(--navy); border-bottom-color:var(--brass); }
  nav.tabbar button.active .n{ background:var(--navy); color:#fff; }

  main{ padding:26px 0 70px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .panel-head{ margin-bottom:20px; }
  .panel-head .tag{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brass); display:block; margin-bottom:3px; }
  .panel-head h2{ font-size:21px; }
  .panel-head .desc{ font-size:12.5px; color:var(--text-3); margin-top:4px; max-width:75ch; line-height:1.6; }

  /* ---------- summary tiles ---------- */
  .summary-label{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:0 0 10px; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
  .kpi-grid.kg-5{ grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:15px 16px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px;
  }
  .kpi .lbl{ font-size:12px; color:var(--text-2); font-weight:500; line-height:1.4; }
  .kpi .val{ font-size:23px; font-weight:700; letter-spacing:-.01em; }
  .kpi .foot{ font-size:11px; color:var(--text-3); margin-top:1px; }

  .delta{ font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:3px; width:fit-content; padding:2px 7px; border-radius:6px; }
  .delta.up{ color:var(--good); background:var(--good-bg); }
  .delta.down{ color:var(--crit); background:var(--crit-bg); }
  .delta.flat{ color:var(--text-2); background:var(--grey-series-tint); }

  /* ---------- section / card ---------- */
  .block-title{ font-size:14.5px; font-weight:700; color:var(--text); margin:0 0 3px; display:flex; align-items:baseline; gap:8px; }
  .block-title .src{ font-size:11px; font-weight:500; color:var(--text-3); }
  .block-sub{ font-size:12px; color:var(--text-3); margin-bottom:12px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:20px 22px; margin-bottom:26px; }

  table{ width:100%; border-collapse:collapse; font-size:12.7px; }
  th,td{ padding:8px 9px; text-align:right; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; }
  thead th{ font-size:11px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:.02em; border-bottom:1.5px solid var(--border); position:sticky; top:0; background:var(--surface); }
  tbody tr:hover{ background:var(--navy-tint); }
  tr.total-row td{ font-weight:700; border-top:1.5px solid var(--border); background:var(--grey-series-tint); }
  tr.subtotal-row td{ font-weight:600; border-top:1px solid var(--border-soft); background:var(--navy-tint); }
  tr.metric-row th{ text-align:left; }
  .table-scroll{ overflow-x:auto; }
  .pos{ color:var(--good); } .neg{ color:var(--crit); }
  /* 신장율/증감액처럼 값의 +/- 자체가 핵심인 행: 텍스트색뿐 아니라 셀 배경도 살짝 입혀서 강조 */
  td.cell-pos{ background:var(--good-bg); color:var(--good); }
  td.cell-neg{ background:var(--crit-bg); color:var(--crit); }
  .muted{ color:var(--text-3); }

  /* grouped / collapsible rows */
  tr.group-row{ cursor:pointer; background:var(--navy-tint); }
  tr.group-row:hover{ background:var(--navy-tint); filter:brightness(0.97); }
  tr.group-row td{ font-weight:700; color:var(--navy-dark); border-bottom:1px solid var(--border); }
  :root:not([data-theme="light"]) tr.group-row td{ color:var(--navy); }
  :root[data-theme="dark"] tr.group-row td{ color:var(--navy); }
  tr.group-row .chev{ display:inline-block; width:14px; transition:transform .15s ease; font-size:10px; color:var(--brass); }
  tr.group-row.open .chev{ transform:rotate(90deg); }
  tr.detail-row{ display:none; }
  tr.detail-row.open{ display:table-row; }
  tr.detail-row td:first-child{ padding-left:26px; color:var(--text-2); font-weight:400; }
  tr.cat-hdr td{ background:var(--brass-tint); font-weight:700; color:var(--brass); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; padding-top:10px; padding-bottom:6px; }

  /* Excel-native style table: 증감 / 금년 / 전년 column groups + vertical grid lines */
  table.xltable{ border-collapse:collapse; }
  table.xltable th, table.xltable td{ border-right:1px solid var(--border-soft); }
  table.xltable th:last-child, table.xltable td:last-child{ border-right:none; }
  table.xltable thead tr:first-child th{ border-bottom:1px solid var(--border); text-align:center; font-size:11px; }
  table.xltable thead tr:last-child th{ border-bottom:1.5px solid var(--border); }
  table.xltable .grp-yoy{ background:var(--brass-tint); color:var(--brass); }
  table.xltable .grp-cur{ background:var(--navy-tint); color:var(--navy-dark); }
  :root:not([data-theme="light"]) table.xltable .grp-cur{ color:var(--navy); }
  :root[data-theme="dark"] table.xltable .grp-cur{ color:var(--navy); }
  table.xltable .grp-py{ background:var(--grey-series-tint); color:var(--text-2); }
  table.xltable td.num.muted{ color:var(--text-3); }
  /* 대분류 구분선(당월/연간누계, 증감/금년/전년 등 그룹 경계) — 튀지 않는 색이지만 확실히 보이도록 */
  table.xltable .grp-yoy, table.xltable .grp-cur, table.xltable .grp-py, table.xltable .grp-end{
    border-right: 2px solid var(--border);
  }

  /* 모든 탭: 표 헤더가 좌/우 정렬이 뒤섞이지 않도록 헤더 셀은 모두 가운데 정렬 */
  #panel-sales thead th, #panel-item thead th, #panel-channel thead th, #panel-season thead th, #panel-detail thead th{ text-align:center; }

  /* season pill selector (within a tab) */
  .season-pills{ display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 18px; }
  .season-pills button{
    font-family:inherit; cursor:pointer; padding:7px 14px; border-radius:99px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:var(--surface); color:var(--text-2);
  }
  .season-pills button:hover{ border-color:var(--navy); color:var(--navy); }
  .season-pills button.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .season-block{ display:none; }
  .season-block.active{ display:block; }

  /* vertical season summary card (시즌 종합현황) */
  .season-card{ border:1px solid var(--border); border-radius:12px; background:var(--surface); margin-bottom:12px; overflow:hidden; }
  .season-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 18px;
    cursor:pointer; background:var(--navy-tint);
  }
  .season-card-head:hover{ filter:brightness(0.98); }
  .season-card-head .name{ font-weight:800; color:var(--navy-dark); font-size:14.5px; display:flex; align-items:center; gap:8px; }
  :root:not([data-theme="light"]) .season-card-head .name{ color:var(--navy); }
  :root[data-theme="dark"] .season-card-head .name{ color:var(--navy); }
  .season-card-head .chev{ display:inline-block; width:14px; font-size:11px; color:var(--brass); transition:transform .15s ease; }
  .season-card.open .season-card-head .chev{ transform:rotate(90deg); }
  .season-card-head .metrics{ display:flex; gap:22px; flex-wrap:wrap; }
  .season-card-head .metrics .m{ text-align:right; }
  .season-card-head .metrics .m .l{ font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.03em; }
  .season-card-head .metrics .m .v{ font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .season-card-body{ display:none; padding:4px 18px 14px; }
  .season-card.open .season-card-body{ display:block; }
  .season-card-body table{ margin-top:6px; }

  .bar-cell{ display:flex; align-items:center; gap:6px; justify-content:flex-end; }
  .minibar-track{ width:56px; height:6px; border-radius:3px; background:var(--border-soft); overflow:hidden; flex:0 0 auto; }
  .minibar-fill{ height:100%; border-radius:3px; }

  .status-pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap; }
  .status-warn{ color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line); }
  .status-good{ color:var(--good); background:var(--good-bg); border:1px solid var(--good-line); }
  .status-crit{ color:var(--crit); background:var(--crit-bg); border:1px solid var(--crit-line); }
  .status-flat{ color:var(--text-3); background:var(--grey-series-tint); border:1px solid var(--border); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11.5px; color:var(--text-2); }
  .legend .sw{ display:inline-flex; align-items:center; gap:6px; }
  .legend .dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .legend .dash{ width:14px; height:0; border-top:2px dashed var(--text-3); display:inline-block; }
  .callout{ margin-top:14px; padding:11px 13px; border-radius:8px; background:var(--navy-tint); border:1px solid var(--border-soft); font-size:12px; color:var(--text-2); line-height:1.6; }
  .callout b{ color:var(--text); }

  .insight-box{ margin-top:10px; padding:16px 20px; border-radius:12px; background:var(--crit-bg); border:1px solid var(--crit-line); display:flex; flex-direction:column; gap:10px; }
  .insight-line{ font-size:16px; font-weight:700; color:var(--crit); line-height:1.5; }
  .insight-line b{ font-weight:900; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:26px; }
  .issue-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow); }
  .issue-card h3{ font-size:15px; margin-bottom:2px; }
  .issue-block{ margin-top:12px; }
  .issue-block .h{ font-size:11px; font-weight:700; color:var(--brass); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  .issue-block ul{ margin:0; padding-left:15px; display:flex; flex-direction:column; gap:4px; }
  .issue-block li{ font-size:12.3px; line-height:1.5; color:var(--text-2); }
  .issue-block li b{ color:var(--text); font-weight:700; }
  .hot-products{ margin-top:12px; padding:9px 11px; border-radius:8px; background:var(--brass-tint); font-size:12px; color:var(--text-2); line-height:1.6; }
  .hot-products b{ color:var(--text); }

  footer{ padding:20px 0 30px; font-size:11px; color:var(--text-3); line-height:1.7; border-top:1px solid var(--border-soft); margin-top:10px; }

  @media (max-width: 900px){
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
    .grid-2{ grid-template-columns:1fr; }
    .grid-3{ grid-template-columns:1fr; }
  }
  @media (max-width: 1200px) and (min-width: 901px){
    .grid-3{ grid-template-columns:1fr 1fr; }
  }
</style>

const TABS = [
  {id:'sales', label:'매출현황'},
  {id:'season', label:'입판재'},
  {id:'item', label:'아이템별 판매'},
  {id:'channel', label:'채널별 판매'},
  {id:'detail', label:'복종별 상세'},
];

function showTab(id){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+id));
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  window.scrollTo({top:0, behavior:'instant'});
  location.hash = id;
}

document.getElementById('tabBar').innerHTML = TABS.map((t,i) =>
  `<button data-tab="${t.id}" onclick="showTab('${t.id}')"><span class="n">${i+1}</span>${t.label}</button>`
).join('');


function toggleGroup(id){
  const row = document.getElementById('grp-'+id);
  const open = row.classList.toggle('open');
  document.querySelectorAll('.detail-row[data-parent="'+id+'"]').forEach(r => r.classList.toggle('open', open));
}

/* ===================== shared formatters ===================== */
const fmtEok = (won, digits=1) => (won==null?'—':(won/1e8).toLocaleString('ko-KR', {minimumFractionDigits:digits, maximumFractionDigits:digits}) + '억');
const fmtMan = (won) => won==null?'—':Math.round(won/10000).toLocaleString('ko-KR');
const fmtWon = (won) => won==null?'—':Math.round(won).toLocaleString('ko-KR');
const fmtQty = (n) => (n==null?'—':Math.round(n).toLocaleString('ko-KR'));
const fmtPct = (x, digits=1) => (x==null?'—':(x*100).toLocaleString('ko-KR', {minimumFractionDigits:digits, maximumFractionDigits:digits}) + '%');
const fmtPctSigned = (x, digits=1) => (x==null?'—':(x>0?'+':'') + fmtPct(x, digits));
const deltaClass = (x) => (x==null?'flat':(x > 0.001 ? 'up' : (x < -0.001 ? 'down' : 'flat')));
const arrow = (x) => (x==null?'':(x > 0.001 ? '▲' : (x < -0.001 ? '▼' : '—')));
const yoyTd = (x, digits=1, extraClass='') => `<td class="num ${x==null?'':(x>0?'pos':'neg')} ${extraClass}">${fmtPctSigned(x,digits)}</td>`;
const fmtEok2 = (won) => fmtEok(won,2);
const fmtPct1 = (x) => fmtPct(x,1);
function growth(cur, py){ return (cur!=null && py) ? cur/py - 1 : null; }

/* Shared "원본 시트" style table: 증감(전년비) / 금년 / 전년 3-그룹, 세로선 포함.
   요구되는 필드: order_qty, order_amt, in_qty, sale_qty, sale_real, sellrate_real, sale_disc, stock_cost
   및 그 py_ 접두사 버전(py_order_qty 등). 증감%는 금년/전년 원자료로 직접 계산합니다. */
const EXCEL_METRICS = [
  {key:'order_qty', py:'py_order_qty', label:'발주수량', fmt:fmtQty},
  {key:'order_amt', py:'py_order_amt', label:'발주금액', fmt:fmtEok2},
  {key:'in_qty', py:'py_in_qty', label:'입고수량', fmt:fmtQty},
  {key:'sale_qty', py:'py_sale_qty', label:'판매수량', fmt:fmtQty},

/* Renders a grouped, collapsible table.
   cols: [{key,label}], groups: [{id, headerCells:[...], rows:[{cells:[...]}]}] */
let __grpSeq = 0;
function groupedTableHTML(theadHtml, groups){
  let html = `<thead>${theadHtml}</thead><tbody>`;
  groups.forEach(grp => {
    const gid = grp.id || ('g' + (__grpSeq++));
    const hasChildren = grp.rows && grp.rows.length > 0;
    html += `<tr class="group-row${hasChildren?'':' no-children'}" id="grp-${gid}" ${hasChildren?`onclick="toggleGroup('${gid}')"`:''}>
      <td>${hasChildren?'<span class="chev">▶</span>':'<span class="chev" style="visibility:hidden">▶</span>'}${grp.label}</td>
      ${grp.headerCells.join('')}
    </tr>`;
    (grp.rows||[]).forEach(r => {
      html += `<tr class="detail-row" data-parent="${gid}"><td>${r.name}</td>${r.cells.join('')}</tr>`;
    });
  });
  html += '</tbody>';
  return html;
}

  const estRate = (estFullMonth!=null && M.plan[monthIdx]) ? estFullMonth/M.plan[monthIdx] : null;

    kpiCard('연간 사업계획', fmtEok(M.plan.reduce((a,b)=>a+b,0)), undefined, undefined, '1~'+CS.month+'월 계획 '+fmtEok(M.plan.slice(0,CS.month).reduce((a,b)=>a+b,0))+' · 실적 '+fmtEok(tot.ytd_actual)),

    <div class="card"><div class="table-scroll"><table class="xltable">${t2cur}</table></div></div>

    <div class="block-sub">월간목표(${monthLabel} 전체 목표, 진도율은 연간 사업계획 목표 대비) · 누계 기간목표(1~${CS.month-1}월 완전월 + ${monthLabel} 기준일까지)/실적/달성율/비중 · 전년동기 실적/신장율/증감액/비중</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${t2ytd}</table></div></div>
    <div class="block-title">행사 내용 <span class="src">Weekly(key Agenda_raw) '영업계획' 시트 (9월)</span></div>
    <div class="block-sub">매장 오픈/철수/MD/인수인계 · 프로모션/행사/주요 이슈 · 기타</div>
    <div class="grid-3">${evtCards}</div>
  `;
}

/* ===================== TAB 2: 아이템별 판매현황 ===================== */
function renderItem(){
  const IC = DATA.itemCategory.monthly;
  const cats = ['가방','의류','모자','기타'];
  const curM = DATA.channelSalesV2.month;

  const ttl = IC['TTL'];
  const kpis = cats.slice(0,3).map(c => {
    const d = IC[c];
    return kpiCard(c+' · '+curM+'월 당월 실판매', fmtEok(d.month_real_cur), fmtPctSigned(d.month_yoy,1), deltaClass(d.month_yoy), '1~'+curM+'월 누계 '+fmtEok(d.ytd_real_cur)+' · 전년비 '+fmtPctSigned(d.ytd_yoy,1));
  });
  kpis.push(kpiCard('전체(TTL) '+curM+'월 당월 실판매', fmtEok(ttl.month_real_cur), fmtPctSigned(ttl.month_yoy,1), deltaClass(ttl.month_yoy), '1~'+curM+'월 누계 '+fmtEok(ttl.ytd_real_cur)+' · 전년비 '+fmtPctSigned(ttl.ytd_yoy,1)));

  function icCells(d){
    return `<td class="num">${fmtQty(d.month_qty_cur)}</td>
      <td class="num grp-end">${fmtEok(d.month_real_cur)}</td>
      <td class="num muted">${fmtQty(d.month_qty_ly)}</td>
      <td class="num muted grp-end">${fmtEok(d.month_real_ly)}</td>
      ${yoyTd(d.month_yoy,1,'grp-end')}
      <td class="num">${fmtQty(d.ytd_qty_cur)}</td>
      <td class="num grp-end">${fmtEok(d.ytd_real_cur)}</td>
      <td class="num muted">${fmtQty(d.ytd_qty_ly)}</td>
      <td class="num muted grp-end">${fmtEok(d.ytd_real_ly)}</td>
      ${yoyTd(d.ytd_yoy)}`;
  }
  // 가방/의류/모자는 클릭 시 복종명 상세(raw ERP + Weekly 집계, 연간누계 실판가 큰 순)가 펼쳐지는
  // 그룹행으로 표시(5번 복종별 상세와 동일한 UI 패턴). 기타/합계는 상세 분해가 없어 일반 행 유지.
  const EXPANDABLE_ITEM_CATS = ['가방','의류','모자'];
  function bigTable(dict){
    let h = `<thead><tr><th rowspan="2">구분</th><th colspan="2" class="grp-end">${curM}월 당월 · 금년</th><th colspan="2" class="grp-end">${curM}월 당월 · 전년</th><th class="grp-end">전년대비</th><th colspan="2" class="grp-end">1~${curM}월 누계 · 금년</th><th colspan="2" class="grp-end">1~${curM}월 누계 · 전년</th><th>전년대비</th></tr>
      <tr><th>수량</th><th class="grp-end">실판가</th><th>수량</th><th class="grp-end">실판가</th><th class="grp-end">신장율</th><th>수량</th><th class="grp-end">실판가</th><th>수량</th><th class="grp-end">실판가</th><th>신장율</th></tr></thead><tbody>`;
    const detailByCat = (DATA.itemCategory.detail) || {};
    cats.forEach(c => {
      const d = dict[c]; if(!d) return;
      const detailRows = EXPANDABLE_ITEM_CATS.includes(c) ? (detailByCat[c] || []) : [];
      const hasChildren = detailRows.length > 0;
      if(!hasChildren){
        h += `<tr><td>${c}</td>${icCells(d)}</tr>`;
        return;
      }
      const gid = 'ic-' + c;
      h += `<tr class="group-row" id="grp-${gid}" onclick="toggleGroup('${gid}')">
        <td><span class="chev">▶</span>${c}</td>
        ${icCells(d)}
      </tr>`;
      detailRows.forEach(r => {
        h += `<tr class="detail-row" data-parent="${gid}"><td>${r.name}</td>${icCells(r)}</tr>`;
      });
    });
    const ttl = dict['TTL'];
    if(ttl){
      h += `<tr class="total-row"><td>합계</td>${icCells(ttl)}</tr>`;
    }
    h += '</tbody>';
    return h;
  }

  // 원본 '아이템별(기획)' 시트의 SS/AW 신상품·이월 블록: 당월(좌) + 연간누계(우),
  // 각각 금년/전년/전년대비(신장율·증감액), 할인율 포함. 아이템(가방/의류/모자)별 카드 안에
  // SS26/AW26/SS이월/AW이월 + 합계를 행으로 배치(2026년 9월 확정 포맷).
  function qtyGrp(){ return `<th>수량</th><th>실판가</th><th class="grp-end">할인율</th>`; }
  function qtyCells(qty,tag,real,disc,muted){
    const m = muted ? ' muted' : '';
    return `<td class="num${m}">${fmtQty(qty)}</td><td class="num${m}">${fmtEok2(real)}</td><td class="num${m} grp-end">${fmtPct(disc,1)}</td>`;
  }
  function yoyDiffCells(yoy,diff){
    return `${yoyTd(yoy)}<td class="num grp-end ${diff==null?'':(diff>0?'pos':'neg')}">${fmtEok2(diff)}</td>`;
  }
  // 아이템(가방/의류/모자)별 카드 안에 SS26/AW26/SS이월/AW이월/합계를 행으로 배치하는 버전.
  // (기존 시즌×이월/신상 블록별 표 포맷·컬럼 구성은 그대로 유지, 그룹핑만 아이템 우선으로 전환)
  const SEASON_KIND_ROWS = [
    {key:'ssNew', label:'SS26'},
    {key:'awNew', label:'AW26'},
    {key:'ssCarry', label:'SS이월'},
    {key:'awCarry', label:'AW이월'},
  ];
  function sumPeriod(rows, prefix){
    const qc = rows.reduce((s,d)=>s+(d[prefix+'_qty_cur']||0),0);
    const tc = rows.reduce((s,d)=>s+(d[prefix+'_tag_cur']||0),0);
    const rc = rows.reduce((s,d)=>s+(d[prefix+'_real_cur']||0),0);
    const ql = rows.reduce((s,d)=>s+(d[prefix+'_qty_ly']||0),0);
    const tl = rows.reduce((s,d)=>s+(d[prefix+'_tag_ly']||0),0);
    const rl = rows.reduce((s,d)=>s+(d[prefix+'_real_ly']||0),0);
    const out = {};
    out[prefix+'_qty_cur']=qc; out[prefix+'_tag_cur']=tc; out[prefix+'_real_cur']=rc;
    out[prefix+'_disc_cur']= tc ? 1-rc/tc : null;
    out[prefix+'_qty_ly']=ql; out[prefix+'_tag_ly']=tl; out[prefix+'_real_ly']=rl;
    out[prefix+'_disc_ly']= tl ? 1-rl/tl : null;
    out[prefix+'_yoy']= rl ? (rc/rl-1) : null;
    out[prefix+'_diff']= rc-rl;
    return out;
  }
  function catTotalRow(cat){
    const rows = SEASON_KIND_ROWS.map(r => DATA.itemFull[r.key][cat]).filter(Boolean);
    if(!rows.length) return null;
    return Object.assign({}, sumPeriod(rows,'month'), sumPeriod(rows,'ytd'));
  }
  function itemFullTableByCat(cat){
    let h = `<thead>
      <tr>
        <th rowspan="3" style="vertical-align:bottom;">구분</th>
        <th colspan="8" class="grp-hdr grp-cur">당월</th>
        <th colspan="8" class="grp-hdr grp-py">연간누계</th>
      </tr>
      <tr>
        <th colspan="3" class="grp-hdr grp-cur">금년</th>
        <th colspan="3" class="grp-hdr grp-py">전년</th>
        <th colspan="2" class="grp-hdr grp-yoy">전년대비</th>
        <th colspan="3" class="grp-hdr grp-cur">금년</th>
        <th colspan="3" class="grp-hdr grp-py">전년</th>
        <th colspan="2" class="grp-hdr grp-yoy">전년대비</th>
      </tr>
      <tr>${qtyGrp()}${qtyGrp()}<th>신장율</th><th class="grp-end">증감액</th>${qtyGrp()}${qtyGrp()}<th>신장율</th><th class="grp-end">증감액</th></tr>
    </thead><tbody>`;
    SEASON_KIND_ROWS.forEach(r => {
      const d = DATA.itemFull[r.key][cat]; if(!d) return;
      h += `<tr>
        <td>${r.label}</td>
        ${qtyCells(d.month_qty_cur, d.month_tag_cur, d.month_real_cur, d.month_disc_cur, false)}
        ${qtyCells(d.month_qty_ly, d.month_tag_ly, d.month_real_ly, d.month_disc_ly, true)}
        ${yoyDiffCells(d.month_yoy, d.month_diff)}
        ${qtyCells(d.ytd_qty_cur, d.ytd_tag_cur, d.ytd_real_cur, d.ytd_disc_cur, false)}
        ${qtyCells(d.ytd_qty_ly, d.ytd_tag_ly, d.ytd_real_ly, d.ytd_disc_ly, true)}
        ${yoyDiffCells(d.ytd_yoy, d.ytd_diff)}
      </tr>`;
    });
    const tot = catTotalRow(cat);
    if(tot){
      h += `<tr class="total-row">
        <td>합계</td>
        ${qtyCells(tot.month_qty_cur, tot.month_tag_cur, tot.month_real_cur, tot.month_disc_cur, false)}
        ${qtyCells(tot.month_qty_ly, tot.month_tag_ly, tot.month_real_ly, tot.month_disc_ly, true)}
        ${yoyDiffCells(tot.month_yoy, tot.month_diff)}
        ${qtyCells(tot.ytd_qty_cur, tot.ytd_tag_cur, tot.ytd_real_cur, tot.ytd_disc_cur, false)}
        ${qtyCells(tot.ytd_qty_ly, tot.ytd_tag_ly, tot.ytd_real_ly, tot.ytd_disc_ly, true)}
        ${yoyDiffCells(tot.ytd_yoy, tot.ytd_diff)}
      </tr>`;
    }
    h += '</tbody>';
    return h;
  }

  // ---- 아이템별 이슈사항: raw 데이터(itemFull)를 근거로 자동 산출 ----
  // 주: 이전에는 detail26AW/26SS(복종별 입판재 파일 기반, raw로 재현 불가)를 근거로
  // "주 판매호조 상품" SKU 목록을 함께 보여줬으나, 해당 파일이 더 이상 제공되지 않아
  // raw 데이터로 재현할 수 없으므로 그 부분은 표시하지 않음(과거 값을 그대로 두지 않고 제거).
  function blockLine(label, d){
    if(!d || !d.ytd_real_cur) return null;
    const discDiff = (d.ytd_disc_cur!=null && d.ytd_disc_ly!=null) ? d.ytd_disc_cur - d.ytd_disc_ly : null;
    let t = `${label} 연간누계 실판매 <b>${fmtEok(d.ytd_real_cur,1)}</b> · 전년비 ${fmtPctSigned(d.ytd_yoy,1)}`;
    if(discDiff!=null && Math.abs(discDiff)>=0.005){
      t += ` · 할인율 ${discDiff>0?'+':''}${(discDiff*100).toFixed(1)}%p ${discDiff>0?'상승':'하락'}(${fmtPct(d.ytd_disc_cur,1)})`;
    }
    return t;
  }
  function buildIssue(title, catNames){
    const IF = DATA.itemFull;
    const aw = [blockLine('AW 신상품', IF.awNew[catNames[0] === '가방' ? '가방' : '의류']), blockLine('AW 이월', IF.awCarry[catNames[0] === '가방' ? '가방' : '의류'])].filter(Boolean);
    const ss = [blockLine('SS 신상품', IF.ssNew[catNames[0] === '가방' ? '가방' : '의류']), blockLine('SS 이월', IF.ssCarry[catNames[0] === '가방' ? '가방' : '의류'])].filter(Boolean);
    return { title, aw, ss };
  }
  function issueCard(d){
    return `<div class="issue-card">
      <h3>${d.title}</h3>
      <div class="issue-block"><div class="h">26AW</div><ul>${d.aw.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      <div class="issue-block"><div class="h">26SS</div><ul>${d.ss.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    </div>`;
  }
  const bagsIssue = buildIssue('가방', ['가방']);
  const clothesIssue = buildIssue('의류', ['의류','의류(여성)']);

  document.getElementById('panel-item').innerHTML = `
    ${panelHead('Item · 아이템별(기획) 시트', '아이템별 판매현황')}
    <div class="summary-label">요약</div>
    <div class="kpi-grid">${kpis.join('')}</div>

    <div class="block-title">1. 월간 / 연간 판매현황</div>
    <div class="block-sub">단위: PCS / 원 · 금년 vs 전년, ${curM}월 당월(raw 데이터 갱신) · 1~${curM}월 누계 · 가방/의류/모자 행을 클릭하면 복종별 상세가 연간누계 실판가 큰 순으로 펼쳐집니다(원본: 판매현황_raw + Weekly 금년실적/전년실적)</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${bigTable(IC)}</table></div></div>

    <div class="block-title">2. 가방</div>
    <div class="block-sub">단위: PCS / 원 · SS26/AW26/SS이월/AW이월 + 합계 · 당월(${curM}월) + 연간누계, 금년/전년/전년대비, 할인율 포함 · 수출·도매·기타2 제외</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${itemFullTableByCat('가방')}</table></div></div>

    <div class="block-title">3. 의류</div>
    <div class="block-sub">단위: PCS / 원 · SS26/AW26/SS이월/AW이월 + 합계 · 당월(${curM}월) + 연간누계, 금년/전년/전년대비, 할인율 포함 · 수출·도매·기타2 제외</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${itemFullTableByCat('의류')}</table></div></div>

    <div class="block-title">4. 모자</div>
    <div class="block-sub">단위: PCS / 원 · SS26/AW26/SS이월/AW이월 + 합계 · 당월(${curM}월) + 연간누계, 금년/전년/전년대비, 할인율 포함 · 수출·도매·기타2 제외</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${itemFullTableByCat('모자')}</table></div></div>

    <div class="block-title">■ 아이템별 이슈사항 <span class="src">raw 데이터 기반 자동 산출(연간누계 · 전년동기 비교)</span></div>
    <div class="block-sub">SS·AW 신상품/이월 연간누계 실판매 전년비, 할인율 변화, 전년비 판매 신장 상품을 근거로 자동 작성됩니다</div>
    <div class="grid-2">
      ${issueCard(bagsIssue)}
      ${issueCard(clothesIssue)}
    </div>
  `;
}

/* ===================== TAB 3: 채널별 판매 ===================== */
function renderChannel(){
  const CS = DATA.channelSalesV2;
  const CD2 = DATA.channelDiscountV2;
  const monthLabel = CS.month + '월';
  const curYY = String(CS.year).slice(2), pyYY = String(CS.py_year).slice(2);
  const cellCls = (v) => v==null?'':(v>0?'cell-pos':(v<0?'cell-neg':''));
  const HIDDEN_CHANNELS = ['직영점','대리점'];
  const GROUPS = ['오프라인','온라인','면세수출기타'];

  const kpis = GROUPS.map(g=>{
    const d = CS.subtotals[g];
    return kpiCard(d.label+' · '+monthLabel+' 실적', fmtEok(d.cur_actual), fmtPctSigned(d.cur_yoy,1), deltaClass(d.cur_yoy), '누계 '+fmtEok(d.ytd_actual)+' · 전년비 '+fmtPctSigned(d.ytd_yoy,1));
  });
  kpis.push(kpiCard('전체 합계 · '+monthLabel+' 실적', fmtEok(CS.total.cur_actual), fmtPctSigned(CS.total.cur_yoy,1), deltaClass(CS.total.cur_yoy), '누계 '+fmtEok(CS.total.ytd_actual)+' · 연간목표 진도율 '+fmtPct(CS.total.progress_rate,1)));
  {
    const dt = CD2.total;
    const ydiffPP = (dt.ytd_diff==null)?undefined:(dt.ytd_diff>=0?'+':'')+(dt.ytd_diff*100).toFixed(1)+'%p';
    kpis.push(kpiCard('1~'+CS.month+'월 총 누계 할인율', dt.ytd_disc==null?'—':fmtPct(dt.ytd_disc,1), ydiffPP, dt.ytd_diff==null?undefined:deltaClass(-dt.ytd_diff), '전년 '+(dt.ytd_py_disc==null?'—':fmtPct(dt.ytd_py_disc,1))+' · 매장판매형태명(수출·도매·기타2) 제외'));
  }

  // ---- 1. 채널별 판매현황 — 1번 탭(매출현황)과 동일한 채널 순서로 구성 ----
  // 컬럼 순서(2026-09-21 확정): 금년실적, 전년실적, 전년비(실적), 비중, 전년비(비중)
  function shareDiffTd(cur, py, extraCls){
    const d = (cur!=null && py!=null) ? (cur-py) : null;
    const txt = d==null?'—':((d>=0?'+':'')+(d*100).toFixed(1)+'%p');
    const cls = d==null?'':(d>0?'pos':(d<0?'neg':''));
    return `<td class="num ${cls} ${extraCls||''}">${txt}</td>`;
  }
  function chanListTable(){
    let h = `<thead><tr>
        <th rowspan="2">채널</th>
        <th colspan="5" class="grp-end">${curYY}년 ${monthLabel} (당월)</th>
        <th colspan="5" class="grp-end">${curYY}년 1~${CS.month}월 (누계)</th>
        <th>연간목표</th><th>진도율</th>
      </tr>
      <tr>
        <th>금년실적</th><th>전년실적</th><th>전년비(실적)</th><th>비중</th><th class="grp-end">전년비(비중)</th>
        <th>금년실적</th><th>전년실적</th><th>전년비(실적)</th><th>비중</th><th class="grp-end">전년비(비중)</th>
        <th>연간목표</th><th>진도율</th>
      </tr></thead><tbody>`;
    function row(r, cls){
      return `<tr${cls?` class="${cls}"`:''}>
        <td>${r.label}</td>
        <td class="num">${fmtEok(r.cur_actual)}</td>
        <td class="num muted">${fmtEok(r.cur_py)}</td>
        ${yoyTd(r.cur_yoy,1)}
        <td class="num">${r.cur_share==null?'—':fmtPct(r.cur_share,1)}</td>
        ${shareDiffTd(r.cur_share, r.cur_py_share, 'grp-end')}
        <td class="num">${fmtEok(r.ytd_actual)}</td>
        <td class="num muted">${fmtEok(r.ytd_py)}</td>
        ${yoyTd(r.ytd_yoy,1)}
        <td class="num">${r.ytd_share==null?'—':fmtPct(r.ytd_share,1)}</td>
        ${shareDiffTd(r.ytd_share, r.ytd_py_share, 'grp-end')}
        <td class="num">${fmtEok(r.annual_target)}</td>
        <td class="num">${fmtPct(r.progress_rate,1)}</td>
      </tr>`;
    }
    GROUPS.forEach(g=>{
      CS.rows.filter(r=>r.group===g && !HIDDEN_CHANNELS.includes(r.key)).forEach(r=>{ h += row(r, ''); });
      h += row(CS.subtotals[g], 'subtotal-row');
    });
    h += row(CS.total, 'total-row');
    h += '</tbody>';
    return h;
  }

  // ---- 2. 채널별 할인율 — 당월/전년동월(Weekly raw 실측) · 1~9월 누계/전년누계(ERP raw 1~8월 + Weekly raw 9월) ----
  // 컬럼 순서(2026-09-21 확정): 당월(전체),전년(전체),차이,당월(신상품),전년(신상품),차이 — 누계도 동일 패턴 반복.
  // 신상품 할인율은 당해 연도명(cur=2026,py=2025) 매칭 거래만 집계(DATA.channelNewDisc), 매장판매형태명
  // (수출/도매/기타2) 제외는 전체 할인율과 동일하게 적용.
  const ND = DATA.channelNewDisc;
  function pctColgroup(n, labelPct){
    const lp = labelPct || 16;
    const cw = ((100 - lp) / n).toFixed(2);
    let cols = `<col style="width:${lp}%;">`;
    for(let i=0;i<n;i++) cols += `<col style="width:${cw}%;">`;
    return `<colgroup>${cols}</colgroup>`;
  }
  function discDiffTd(v, extraCls){
    const txt = v==null?'—':((v>=0?'+':'')+(v*100).toFixed(1)+'%p');
    const cls = v==null?'':(v>0?'cell-neg':(v<0?'cell-pos':''));
    return `<td class="num ${cls} ${extraCls||''}">${txt}</td>`;
  }
  function discTable2(){
    let h = pctColgroup(12, 10) + `<thead><tr>
        <th rowspan="3">채널</th>
        <th colspan="6" class="grp-end">${monthLabel} 할인율</th>
        <th colspan="6">1~${CS.month}월 누계 할인율</th>
      </tr>
      <tr>
        <th colspan="3">전체</th><th colspan="3" class="grp-end">신상품</th>
        <th colspan="3">전체</th><th colspan="3">신상품</th>
      </tr>
      <tr>
        <th>당월</th><th>전년</th><th>차이</th>
        <th>당월</th><th>전년</th><th class="grp-end">차이</th>
        <th>누계</th><th>전년누계</th><th>차이</th>
        <th>누계</th><th>전년누계</th><th>차이</th>
      </tr></thead><tbody>`;
    function row(d, dn, label, cls){
      if(!d) return '';
      dn = dn || {};
      return `<tr${cls?` class="${cls}"`:''}>
        <td>${label}</td>
        <td class="num">${d.cur_disc==null?'—':fmtPct(d.cur_disc,1)}</td>
        <td class="num muted">${d.py_disc==null?'—':fmtPct(d.py_disc,1)}</td>
        ${discDiffTd(d.diff)}
        <td class="num">${dn.cur_disc==null?'—':fmtPct(dn.cur_disc,1)}</td>
        <td class="num muted">${dn.py_disc==null?'—':fmtPct(dn.py_disc,1)}</td>
        ${discDiffTd(dn.diff, 'grp-end')}
        <td class="num">${d.ytd_disc==null?'—':fmtPct(d.ytd_disc,1)}</td>
        <td class="num muted">${d.ytd_py_disc==null?'—':fmtPct(d.ytd_py_disc,1)}</td>
        ${discDiffTd(d.ytd_diff)}
        <td class="num">${dn.ytd_disc==null?'—':fmtPct(dn.ytd_disc,1)}</td>
        <td class="num muted">${dn.ytd_py_disc==null?'—':fmtPct(dn.ytd_py_disc,1)}</td>
        ${discDiffTd(dn.ytd_diff)}
      </tr>`;
    }
    GROUPS.forEach(g=>{
      CS.rows.filter(r=>r.group===g && !HIDDEN_CHANNELS.includes(r.key)).forEach(r=>{ h += row(CD2.channels[r.key], ND.channels[r.key], r.label, ''); });
      h += row(CD2.subtotals[g], ND.subtotals[g], CS.subtotals[g].label, 'subtotal-row');
    });
    h += row(CD2.total, ND.total, '합계', 'total-row');
    h += '</tbody>';
    return h;
  }

  // ---- 3. 신상품 구성비 — 2.채널별 할인율과 동일한 표 포맷(당월/전년동월/차이 · 누계/전년누계/차이) ----
  const NR = DATA.channelNewRatio;
  function newRatioTable(){
    let h = pctColgroup(6, 16) + `<thead><tr>
        <th rowspan="2">채널</th>
        <th colspan="3" class="grp-end">${monthLabel} 신상품 구성비</th>
        <th colspan="3">1~${CS.month}월 누계 신상품 구성비</th>
      </tr>
      <tr>
        <th>당월</th><th>전년동월</th><th class="grp-end">차이</th>
        <th>금년 누계</th><th>전년 누계</th><th>차이</th>
      </tr></thead><tbody>`;
    function row(d, label, cls){
      if(!d) return '';
      const diffTxt = d.diff==null?'—':((d.diff>=0?'+':'')+(d.diff*100).toFixed(1)+'%p');
      const diffCls = d.diff==null?'':(d.diff>0?'cell-pos':(d.diff<0?'cell-neg':''));
      const ydiffTxt = d.ytd_diff==null?'—':((d.ytd_diff>=0?'+':'')+(d.ytd_diff*100).toFixed(1)+'%p');
      const ydiffCls = d.ytd_diff==null?'':(d.ytd_diff>0?'cell-pos':(d.ytd_diff<0?'cell-neg':''));
      return `<tr${cls?` class="${cls}"`:''}>
        <td>${label}</td>
        <td class="num">${d.cur_ratio==null?'—':fmtPct(d.cur_ratio,1)}</td>
        <td class="num muted">${d.py_ratio==null?'—':fmtPct(d.py_ratio,1)}</td>
        <td class="num ${diffCls} grp-end">${diffTxt}</td>
        <td class="num">${d.ytd_ratio==null?'—':fmtPct(d.ytd_ratio,1)}</td>
        <td class="num muted">${d.ytd_py_ratio==null?'—':fmtPct(d.ytd_py_ratio,1)}</td>
        <td class="num ${ydiffCls}">${ydiffTxt}</td>
      </tr>`;
    }
    GROUPS.forEach(g=>{
      CS.rows.filter(r=>r.group===g && !HIDDEN_CHANNELS.includes(r.key)).forEach(r=>{ h += row(NR.channels[r.key], r.label, ''); });
      h += row(NR.subtotals[g], CS.subtotals[g].label, 'subtotal-row');
    });
    h += row(NR.total, '합계', 'total-row');
    h += '</tbody>';
    return h;
  }

  document.getElementById('panel-channel').innerHTML = `
    ${panelHead('Channel · 매출(영업)월 시트 + 캉골입판재 raw', '채널별 판매')}
    <div class="summary-label">요약</div>
    <div class="kpi-grid kg-5">${kpis.join('')}</div>

    <div class="block-title">1. 채널별 판매현황 <span class="src">1. 매출현황과 동일한 채널 순서</span></div>
    <div class="block-sub">단위: 억원 · ${curYY}년 ${monthLabel}(당월) · 1~${CS.month}월 누계 · 연간 사업계획 목표 대비 진도율</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${chanListTable()}</table></div></div>

    <div class="block-title">2. 채널별 할인율 <span class="src">${CD2.note_ytd}</span></div>
    <div class="block-sub">할인율 = 1 − 실판가금액 ÷ 최초가(TAG)금액 · ${CD2.note_month}</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${discTable2()}</table></div></div>

    <div class="block-title">3. 신상품 구성비 <span class="src">${NR.note}</span></div>
    <div class="block-sub">신상품 구성비 = 신상 시즌(26AW/26SS, 년도명 2026) 실판매 ÷ 채널 전체 실판매 · 전년 컬럼은 전년 자체 신상(25AW/25SS) 기준</div>
    <div class="card"><div class="table-scroll"><table class="xltable">${newRatioTable()}</table></div></div>
  `;
}

/* ===================== TAB 4: 시즌 종합현황 (시즌계 시트 형태 차용, 세로 카드형 + 그룹 접기/펼치기) ===================== */
function slugify(s){ return String(s).replace(/[^\w가-힣]+/g,'-'); }

function toggleSeasonCard(id){
  document.getElementById('scard-'+id).classList.toggle('open');
}

function renderSeason(){
  const SC = DATA.seasonCompare;
  const S = DATA.inpanjaeSummary;
  const itemNames = ['가방','의류','의류(여성)','수입모자','신발'];

  function seasonCardHtml(label, total, itemsObj, openByDefault, plain){
    const id = slugify(label);
    const inProgress = seasonInProgress(total);
    const thead = excelThead('카테고리', inProgress);
    const orderYoy = inProgress ? growth(total.order_qty, total.py_in_qty) : growth(total.in_qty, total.py_in_qty);
    const saleYoy = growth(total.sale_real, total.py_sale_real);
    const stockYoy = growth(total.stock_cost, total.py_stock_cost);
    let rows = '';
    itemNames.forEach(name=>{
      const d = itemsObj ? itemsObj[name] : null;
      if(!d || !d.order_qty) return;
      rows += `<tr><td style="padding-left:8px; color:var(--text-2); font-weight:400;">${name}</td>${excelCells(d, inProgress)}</tr>`;
    });
    rows += `<tr class="total-row"><td>${label} 계</td>${excelCells(total, inProgress)}</tr>`;
    return `
      <div class="season-card${openByDefault?' open':''}" id="scard-${id}">
        <div class="season-card-head"${plain?'':` onclick="toggleSeasonCard('${id}')"`} style="${plain?'cursor:default;':''}">
          <div class="name">${plain?'':'<span class="chev">▶</span>'}${label}</div>
          <div class="metrics">
            <div class="m"><div class="l">발주금액</div><div class="v">${fmtEok(total.order_amt,1)}</div></div>
            <div class="m"><div class="l">판매실판가</div><div class="v">${fmtEok(total.sale_real,1)}</div></div>
            <div class="m"><div class="l">판매율</div><div class="v">${fmtPct(total.sellrate_real,1)}</div></div>
            <div class="m"><div class="l">할인율</div><div class="v">${fmtPct(total.sale_disc,1)}</div></div>
            <div class="m"><div class="l">재고금액(원가)</div><div class="v">${fmtEok(total.stock_cost,1)}</div></div>
            <div class="m"><div class="l">${inProgress?'발주':'입고'} 전년비</div><div class="v ${orderYoy==null?'':(orderYoy>0?'pos':'neg')}">${fmtPctSigned(orderYoy,1)}</div></div>
            <div class="m"><div class="l">판매 전년비</div><div class="v ${saleYoy==null?'':(saleYoy>0?'pos':'neg')}">${fmtPctSigned(saleYoy,1)}</div></div>
            <div class="m"><div class="l">재고 전년비</div><div class="v ${stockYoy==null?'':(stockYoy>0?'neg':'pos')}">${fmtPctSigned(stockYoy,1)}</div></div>
          </div>
        </div>
        ${plain?'':`<div class="season-card-body"><div class="table-scroll"><table class="xltable"><thead>${thead}</thead><tbody>${rows}</tbody></table></div></div>`}
      </div>`;
  }

  // 전체 합계 카드도 다른 시즌 카드와 동일하게 상세 펼치기가 되도록, 전 시즌(신상+이월)의
  // 카테고리별 수치를 합산한 itemsObj를 합성한다.
  function sumGrandItems(){
    const allGroups = [...SC.seasons, ...SC.carry];
    const numKeys = Object.keys(SC.grandTotal);
    const out = {};
    itemNames.forEach(name=>{
      const acc = {}; numKeys.forEach(k=> acc[k]=0);
      let any = false;
      allGroups.forEach(g=>{
        const d = g.items ? g.items[name] : null;
        if(!d) return;
        any = true;
        numKeys.forEach(k=>{ if(typeof d[k] === 'number') acc[k]+=d[k]; });
      });
      if(any){
        acc.sellrate_qty = acc.order_qty ? acc.sale_qty/acc.order_qty : null;
        acc.sellrate_real = acc.order_amt ? acc.sale_real/acc.order_amt : null;
        acc.sale_disc = acc.sale_tag ? 1-(acc.sale_real/acc.sale_tag) : null;
        acc.py_sellrate_qty = acc.py_order_qty ? acc.py_sale_qty/acc.py_order_qty : null;
        acc.py_sellrate_real = acc.py_order_amt ? acc.py_sale_real/acc.py_order_amt : null;
        acc.py_sale_disc = acc.py_sale_tag ? 1-(acc.py_sale_real/acc.py_sale_tag) : null;
        out[name] = acc;
      }
    });
    return out;
  }

  let cardsHtml = '';
  SC.seasons.forEach((s,i) => { cardsHtml += seasonCardHtml(s.season, s.total, s.items, i===0, false); });
  cardsHtml += `<div class="block-title" style="margin-top:18px;">이월 재고 <span class="src">원본: 입판재26/25 시트(raw) · 2023~2025년 통일(이월AW는 25AW가 활성행이라 2025 제외)</span></div>`;
  SC.carry.forEach(s => { cardsHtml += seasonCardHtml(s.season, s.total, s.items, false, false); });
  cardsHtml += seasonCardHtml('전체 합계', SC.grandTotal, sumGrandItems(), false, false);

  // ---- 요약 KPI (전체 시즌 기준: 시즌계 grandTotal) ----
  const gt = SC.grandTotal;
  // 금년 총매출 카드는 매출현황(Tab1)의 누계실적과 정확히 일치시키기 위해 channelSalesV2.total을 그대로 사용
  const CSV_TOT = DATA.channelSalesV2 ? DATA.channelSalesV2.total : null;
  const totalSaleGrowth = CSV_TOT ? CSV_TOT.ytd_yoy : growth(gt.sale_real, gt.py_sale_real);
  const stockCostGrowth = growth(gt.stock_cost, gt.py_stock_cost);
  // 할인율은 매장판매형태명(수출/도매/기타2) 제외 기준으로 산출해야 함. 입판재 자체에는 매장(판매형태) 정보가
  // 없어 직접 제외가 불가능하므로, 판매현황_raw(ERP)+Weekly에서 수출/도매/기타2 거래의 TAG/실판가를
  // (복종·시즌·연도) 단위로 별도 집계해 입판재 기반 TAG/실판가에서 차감한 뒤 산출(DATA.discountRate, 2026-09 확정 방식).
  const DR = DATA.discountRate ? DATA.discountRate.overall : null;
  const discPP = (DR && DR.cur_disc!=null && DR.py_disc!=null) ? (DR.cur_disc - DR.py_disc) : null;

  // 현재 시점의 시즌 신상품 판매율·할인율 (3~8월=SS, 9~2월=AW, 해당 연도 기준)
  const _now = new Date();
  const _m = _now.getMonth()+1;
  let curType, curYearNum;
  if(_m>=3 && _m<=8){ curType='SS'; curYearNum=_now.getFullYear(); }
  else if(_m>=9){ curType='AW'; curYearNum=_now.getFullYear(); }
  else { curType='AW'; curYearNum=_now.getFullYear()-1; }
  const curSeasonLabel = String(curYearNum).slice(2)+curType;
  const curSeasonObj = SC.seasons.find(s=>s.season===curSeasonLabel) || SC.seasons.find(s=>s.season.endsWith(curType));
  const curSeasonTotal = curSeasonObj ? curSeasonObj.total : null;

  const kpis = [
    kpiCard('금년 총매출(누계)', CSV_TOT?fmtEok(CSV_TOT.ytd_actual,1):fmtEok(gt.sale_real,1), fmtPctSigned(totalSaleGrowth,1), deltaClass(totalSaleGrowth), '전년 '+(CSV_TOT?fmtEok(CSV_TOT.ytd_py,1):fmtEok(gt.py_sale_real,1))+' · 매출현황과 동일'),
    kpiCard('금년 할인율(전체 시즌)', DR?fmtPct(DR.cur_disc,1):'—', discPP==null?undefined:(discPP>=0?'+':'')+(discPP*100).toFixed(1)+'%p', discPP==null?undefined:deltaClass(-discPP), (DR?'전년 '+fmtPct(DR.py_disc,1):'')+' · 매장판매형태명(수출·도매·기타2) 제외'),
    kpiCard('전체 재고(원가금액)', fmtEok(gt.stock_cost,1), undefined, undefined, '재고수량 '+fmtQty(gt.stock_qty)+' pcs'),
    kpiCard('재고금액 전년비', fmtPctSigned(stockCostGrowth,1), undefined, undefined, deltaClass(-stockCostGrowth)==='up'?'전년보다 재고 부담 완화':'전년보다 재고 부담 확대'),
    kpiCard('현재시즌('+curType+') 신상품 판매율', curSeasonTotal?fmtPct(curSeasonTotal.sellrate_real,1):'—', undefined, undefined, curSeasonTotal?('할인율 '+fmtPct(curSeasonTotal.sale_disc,1)+' · '+curSeasonObj.season+' 신상품 기준'):'데이터 없음'),
  ];

  // ---- 주요사항: 데이터 기반 자동 코멘트 ----
  const newSeasonSaleCur = SC.seasons.reduce((s,x)=>s+(x.total.sale_real||0),0);
  const newSeasonSalePy = SC.seasons.reduce((s,x)=>s+(x.total.py_sale_real||0),0);
  const carrySaleCur = SC.carry.reduce((s,x)=>s+(x.total.sale_real||0),0);
  const carrySalePy = SC.carry.reduce((s,x)=>s+(x.total.py_sale_real||0),0);
  const newSeasonGrowth = growth(newSeasonSaleCur, newSeasonSalePy);
  const carryGrowth = growth(carrySaleCur, carrySalePy);
  const aw26Total = SC.seasons[0].total;
  const aw26OrderGrowth = growth(aw26Total.order_amt, aw26Total.py_order_amt);

  const insights = [];
  if(newSeasonGrowth!=null && carryGrowth!=null){
    if(carryGrowth > newSeasonGrowth){
      insights.push(`이월재고(SS+AW) 판매 전년비 <b>${fmtPctSigned(carryGrowth,1)}</b>, 신상시즌(26AW·26SS·25AW) 판매 전년비 ${fmtPctSigned(newSeasonGrowth,1)}보다 높음 — 지금 매출은 이월재고가 견인하고 있어, 이월재고 소진 속도와 재입고 필요 여부 점검 요망`);
    } else {
      insights.push(`신상시즌(26AW·26SS·25AW) 판매 전년비 <b>${fmtPctSigned(newSeasonGrowth,1)}</b>, 이월재고 판매 전년비 ${fmtPctSigned(carryGrowth,1)}보다 높음 — 신상품이 이월재고 대비 우수한 성과`);
    }
  }
  if(aw26OrderGrowth!=null){
    insights.push(`26AW 발주금액 전년비 <b>${fmtPctSigned(aw26OrderGrowth,1)}</b> — ${aw26OrderGrowth<0?'전년 대비 보수적 발주':'전년 대비 공격적 발주'}`);
  }
  if(discPP!=null && Math.abs(discPP)>=0.005){
    insights.push(`전체 할인율 전년 대비 <b>${discPP>=0?'+':''}${(discPP*100).toFixed(1)}%p ${discPP>0?'상승':'하락'}</b> — ${discPP>0?'프로모션·마크다운 부담이 커지고 있어 점검 필요':'할인 부담 완화 추세'}`);
  }
  if(stockCostGrowth!=null && Math.abs(stockCostGrowth)>=0.05){
    insights.push(`전체 재고금액(원가) 전년 대비 <b>${fmtPctSigned(stockCostGrowth,1)} ${stockCostGrowth>0?'증가':'감소'}</b> — ${stockCostGrowth>0?'재고 부담 확대 유의':'재고 수준 안정적 관리 중'}`);
  }
  const insightsHtml = insights.length ? `
    <div class="block-title" style="margin-top:22px;">주요사항</div>
    <div class="insight-box">${insights.map(t=>`<div class="insight-line">${t}</div>`).join('')}</div>` : '';

  document.getElementById('panel-season').innerHTML = `
    ${panelHead('Season · 입판재26/25 시트 (raw)', '입판재')}
    <div class="summary-label">요약</div>
    <div class="kpi-grid kg-5">${kpis.join('')}</div>
    ${insightsHtml}
    <div class="block-title" style="margin-top:22px;">시즌별 종합현황 <span class="src">원본: 입판재26/25 시트(raw)</span></div>
    <div class="block-sub">카드 헤더를 클릭하면 원본 시트와 동일한 증감(전년비)·금년·전년 3단 표가 펼쳐집니다 · 단위: PCS / 원 · <b>*</b> 입고가 아직 진행 중인 시즌(예: 26AW)은 증감의 첫 컬럼이 금년 발주 vs 전년 입고 기준이고, 입고가 끝난 시즌은 금년 입고 vs 전년 입고 기준입니다 · <b>참고</b> 전체 합계(시즌+이월)는 이월 범위(2023~2025년)보다 오래된 2020~2022년 빈티지 잔여 재고(총 실판매 약 0.05억, 매출 전체의 0.01% 수준)가 제외되어 있어, 1번 매출현황 탭의 누계매출과 소수점 이하 단위에서 미세하게 차이가 날 수 있습니다.</div>
    ${cardsHtml}
  `;
}

/* ===================== helpers shared by 복종상세 탭 ===================== */
function findDetailCat(detailArr, catName){
  return (detailArr||[]).find(g => g.cat === catName);
}
function detailSourceFor(season){
  if(season==='26AW') return DATA.detail26AW;
  if(season==='26SS') return DATA.detail26SS;
  return null;
}
function subRowCellsFromDetail(row){
  const yoySales = row.sale_real && row.py_sale_real ? row.sale_real/row.py_sale_real - 1 : null;
  const yoyStock = row.stock_qty!=null && row.py_stock_qty ? row.stock_qty/row.py_stock_qty - 1 : null;
  const sellReal = row.sellrate_real!=null ? row.sellrate_real : (row.sale_real && row.order_amt ? row.sale_real/row.order_amt : null);
  return [
    `<td class="num">${fmtQty(row.in_qty)}</td>`,
    `<td class="num">${fmtQty(row.sale_qty)}</td>`,
    `<td class="num">${fmtEok(row.sale_real,2)}</td>`,
    `<td class="num">${fmtPct(sellReal,1)}</td>`,
    `<td class="num">${fmtQty(row.stock_qty)}</td>`,
    `<td class="num">${fmtEok(row.stock_realamt!=null?row.stock_realamt:row.stock_cost,2)}</td>`,
    yoyTd(yoySales),
    yoyTd(yoyStock),
  ].join('');
}

/* ===================== TAB 5: 복종별 상세 (입판재/SS/AW/AW(2) 시트 형태 차용, 시즌 선택형 + 그룹 접기/펼치기) ===================== */
// 시즌 선택 pill에 대응하는 정규화된 합계 (26AW/26SS/25AW는 시즌계 시트, 25SS는 입판재 시트,
// carry는 이월 SS+AW 합산). 요약 KPI 카드가 선택된 시즌에 맞춰 바뀌도록 지원합니다.
function seasonTotalsForDetail(id){
  const SC = DATA.seasonCompare;
  const seasonObj = SC.seasons.find(s => s.season === id);
  const t = seasonObj.total;
  return Object.assign({label:id, inProgress:seasonInProgress(t)}, t);
}
function kpisForSeason(id){
  const t = seasonTotalsForDetail(id);
  const saleYoy = growth(t.sale_real, t.py_sale_real);
  const stockYoy = growth(t.stock_qty, t.py_stock_qty);
  const firstYoy = t.inProgress ? growth(t.order_qty, t.py_in_qty) : growth(t.in_qty, t.py_in_qty);
  const cards = [];
  if(t.inProgress){
    cards.push(kpiCard(`${t.label} 발주금액`, fmtEok(t.order_amt,1), undefined, undefined, '입고 진행률(발주대비) '+fmtPct(t.order_qty?t.in_qty/t.order_qty:null,1)));
  } else {
    cards.push(kpiCard(`${t.label} 입고수량`, fmtQty(t.in_qty), undefined, undefined, '입고금액 '+fmtEok(t.in_amt,0)));
  }
  cards.push(kpiCard(`${t.label} 시즌누계 판매`, fmtEok(t.sale_real,1), fmtPctSigned(saleYoy,1), deltaClass(saleYoy), '판매율(실판가) '+fmtPct(t.sellrate_real,1)));
  cards.push(kpiCard(`${t.label} 재고`, fmtQty(t.stock_qty)+' pcs', fmtPctSigned(stockYoy,1), deltaClass(-stockYoy), t.py_stock_qty!=null?('전년 재고 '+fmtQty(t.py_stock_qty)+' pcs'):''));
  cards.push(kpiCard(`${t.label} ${t.inProgress?'발주':'입고'} 전년비`, fmtPctSigned(firstYoy,1), undefined, undefined, t.inProgress?'금년 발주 vs 전년 입고 기준':'금년 입고 vs 전년 입고 기준'));
  // 할인율: 매장판매형태명(수출/도매/기타2) 제외 기준 — 입판재 자체엔 매장 정보가 없어, 판매현황_raw(ERP)+Weekly에서
  // 해당 채널 거래를 (복종·시즌·연도) 단위로 집계해 차감한 DATA.discountRate[시즌]을 사용
  const dr = DATA.discountRate ? DATA.discountRate[id] : null;
  if(dr){
    const drPP = (dr.cur_disc!=null && dr.py_disc!=null) ? (dr.cur_disc - dr.py_disc) : null;
    cards.push(kpiCard(`${t.label} 할인율`, fmtPct(dr.cur_disc,1), drPP==null?undefined:(drPP>=0?'+':'')+(drPP*100).toFixed(1)+'%p', drPP==null?undefined:deltaClass(-drPP), '전년 '+fmtPct(dr.py_disc,1)+' · 매장판매형태명(수출·도매·기타2) 제외'));
  }
  return cards.join('');
}

function switchDetailSeason(id){
  document.querySelectorAll('#panel-detail .season-pills button').forEach(b => b.classList.toggle('active', b.dataset.season===id));
  document.querySelectorAll('#panel-detail .season-block').forEach(b => b.classList.toggle('active', b.id === 'dblock-'+id));
  const grid = document.getElementById('detailKpiGrid');
  if(grid) grid.innerHTML = kpisForSeason(id);
}

function renderDetailUnified(){
  const SC = DATA.seasonCompare;
  const DETAIL_SRC_LABEL = {'26AW':'입판재26(raw)', '26SS':'입판재26(raw)'};
  const SEASON_IDS = ['26AW', '26SS'];
  const initialSeasonId = SEASON_IDS[0];

  function catGroup(catObj, inProgress){
    return {
      id: catObj.cat,
      label: catObj.cat,
      headerCells: [excelCells(catObj.subtotal, inProgress)],
      rows: catObj.rows.map(r => ({name:r.name, cells:[excelCells(r, inProgress)]})),
    };
  }

  // 26AW/26SS: 원본(입판재26 시트)에 발주·전년 원자료가 모두 있어 증감/금년/전년 3단 표 + 복종 드릴다운 제공.
  // 카테고리는 '아이템' 필드가 아닌 기획명(가방/의류/의류(여성)/수입모자→모자) 기준으로 재구성됨(2026-09-21).
  function detailArrBlockHtml(season, detailArr){
    const seasonTotal = (SC.seasons.find(s=>s.season===season)||{}).total;
    const inProgress = seasonInProgress(seasonTotal);
    const groups = detailArr.map(g => catGroup(g, inProgress));
    let tableInner = groupedTableHTML(excelThead('아이템 / 복종', inProgress), groups);
    if(seasonTotal){
      const totalRow = `<tr class="total-row"><td>${season} 계</td>${excelCells(seasonTotal, inProgress)}</tr>`;
      tableInner = tableInner.replace('</tbody>', totalRow + '</tbody>');
    }
    return `<div class="block-sub">아이템 행을 클릭하면 복종별 상세가 발주금액 큰 순으로 펼쳐집니다 · 원본: ${DETAIL_SRC_LABEL[season]} 시트 · 카테고리는 기획명(가방/의류/의류(여성)/모자) 기준${inProgress?' · <b>*</b> 증감 첫 컬럼은 금년 발주 vs 전년 입고 기준':''}</div>
      <div class="card"><div class="table-scroll"><table class="xltable">${tableInner}</table></div></div>`;
  }

  const pillsHtml = SEASON_IDS.map((id,i) =>
    `<button data-season="${id}" class="${i===0?'active':''}" onclick="switchDetailSeason('${id}')">${id}</button>`
  ).join('');

  let blocksHtml = '';
  SEASON_IDS.forEach((id,i) => {
    const detailArr = detailSourceFor(id);
    const inner = detailArrBlockHtml(id, detailArr);
    blocksHtml += `<div class="season-block${i===0?' active':''}" id="dblock-${id}">${inner}</div>`;
  });

  document.getElementById('panel-detail').innerHTML = `
    ${panelHead('Inpanjae · 입판재26 시트 (raw)', '복종별 상세')}
    <div class="summary-label">요약 <span style="text-transform:none; font-weight:500; letter-spacing:normal; color:var(--text-3);">· 아래 시즌 선택에 따라 갱신됩니다</span></div>
    <div class="kpi-grid kg-5" id="detailKpiGrid">${kpisForSeason(initialSeasonId)}</div>
    <div class="block-title">시즌별 복종상세</div>
    <div class="season-pills">${pillsHtml}</div>
    ${blocksHtml}
  `;
}

/* ===================== 기준일(헤더) ===================== */
// raw데이터(Weekly 금년실적 시트의 판매일자)의 최댓값을 기준일로 표시. 리포트는 통상 일요일 마감
// 데이터를 기준으로 갱신되므로, 기준일이 일요일이 아니면 데이터 갱신 주기에 이상이 있을 수 있어
// 경고 배지로 표시하고 사용자에게 재확인을 요청한다(자동으로 넘어가지 않음).
function renderHeaderMeta(){
  const m = DATA.meta || {};
  const el = document.getElementById('headerMetaRow');
  if(!el || !m.asOfDate) return;
  const isSunday = !!m.asOfIsSunday;
  const wd = m.asOfWeekdayKr || '';
  const label = `기준일 ${m.asOfDate}${wd?` (${wd})`:''}`;
  if(isSunday){
    el.innerHTML = `<span class="pill"><b>${label}</b></span>`;
  } else {
    el.innerHTML = `<span class="pill warn">⚠ <b>${label}</b> — 일요일이 아닙니다, raw 데이터 갱신 주기를 확인해주세요</span>`;
  }
}

/* ===================== init ===================== */
renderHeaderMeta();
renderSales();
renderItem();
renderChannel();
renderSeason();
renderDetailUnified();

const initialTab = (location.hash ? location.hash.slice(1) : '') || 'sales';
showTab(TABS.some(t => t.id === initialTab) ? initialTab : 'sales');
</script>
